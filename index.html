<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Satgas Trantibum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo-satpol.png" alt="Logo Satpol PP">
            <img src="logo-inhu.png" alt="Logo Inhu">
        </div>
        <h1>Laporan Satgas Trantibum</h1>
        <form id="reportForm">
            <label for="tanggal">Tanggal:</label>
            <input type="date" id="tanggal" required>

            <label for="lokasi">Lokasi:</label>
            <input type="text" id="lokasi" required>

            <label for="kegiatan">Uraian Kegiatan:</label>
            <textarea id="kegiatan" rows="4" required></textarea>

            <label for="foto">Dokumentasi Foto:</label>
            <input type="file" id="foto" accept="image/*">

            <button type="submit">Kirim Laporan</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
