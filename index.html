<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiLAHAPP - Sistem Laporan Harian Piket dan Patroli</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR KIRI -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="logo-satpol.png" alt="Logo Satpol">
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item active" data-target="silahapp" title="SiLAHAPP">
                    <i class="fa-solid fa-house-laptop"></i>
                    <span class="menu-text">SiLAHAPP</span>
                </li>
                <li class="menu-item" data-target="coming-soon" title="Coming Soon">
                    <i class="fa-solid fa-rocket"></i>
                    <span class="menu-text">Coming Soon</span>
                </li>
            </ul>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="main-content">
            <!-- View 1: SiLAHAPP (Halaman Laporan Utama) -->
            <div id="view-silahapp" class="app-view active-view">
                <header class="app-header">
                    <div class="header-left">
                        <div class="logo-group">
                            <img src="logo-inhu.png" alt="Logo Inhu" class="logo-img">
                            <img src="logo-satpol.png" alt="Logo Satpol" class="logo-img">
                        </div>
                        <div class="title-group">
                            <h1>SiLAHAPP</h1>
                            <p>Sistem Laporan Harian Piket dan Patroli</p>
                        </div>
                    </div>
                    <div class="header-right">
                        <button class="profile-btn" id="profileBtn">
                            <i class="fa-solid fa-user-gear"></i> Pengaturan Profil
                        </button>
                    </div>
                </header>

                <div class="content-body">
                    <!-- Form Patroli & Pratinjau Dokumen A4 Anda yang sudah ada -->
                    <!-- (Pertahankan struktur form asli Anda di sini agar fungsi lama tetap aman) -->
                </div>
            </div>

            <!-- View 2: Coming Soon -->
            <div id="view-coming-soon" class="app-view">
                <div class="coming-soon-container">
                    <i class="fa-solid fa-person-digging coming-soon-icon"></i>
                    <h2>Coming Soon</h2>
                    <p>Fitur tambahan sedang dalam tahap pengembangan.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
