<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Resmi Satpol PP INHU</title>
    <!-- Menghubungkan ke CSS eksternal -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Panel Tombol Download (Khusus untuk tampilan di layar) */
        .download-panel {
            width: 210mm;
            margin: 10px auto;
            text-align: right;
        }
        .btn-download {
            background-color: #007bff;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-download:hover {
            background-color: #0056b3;
        }
        /* Sembunyikan tombol saat dicetak/print */
        @media print {
            .download-panel {
                display: none;
            }
            body {
                background-color: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol untuk Mengunduh File CSS -->
    <div class="download-panel">
        <button class="btn-download" onclick="downloadCSS()">⬇ Download File CSS (style.css)</button>
    </div>

    <div class="container">
        <!-- Kop Surat -->
        <div class="header">
            <!-- Logo Kiri: Logo Kabupaten INHU -->
            <img class="logo" src="https://lh3.googleusercontent.com/d/1CQz4gxA1VCO4hcR7AnlDXeD4FVM6JQMw" alt="Logo Kabupaten INHU">
            
            <!-- Teks Kop Surat -->
            <div class="header-text">
                <h2>PEMERINTAH KABUPATEN INDRAGIRI HULU</h2>
                <h3>SATUAN POLISI PAMONG PRAJA</h3>
                <p>Jl. Jenderal Sudirman No. 1, Rengat, Kabupaten Indragiri Hulu, Riau</p>
                <p>Website: inhukab.go.id | Email: satpolpp@inhukab.go.id</p>
            </div>

            <!-- Logo Kanan: Logo Satpol PP -->
            <img class="logo" src="https://lh3.googleusercontent.com/d/1sxdzLxjYv-T3N2D7EH1cIP1YvOKlMxdr" alt="Logo Satpol PP">
        </div>

        <!-- Isi Dokumen / Surat -->

    </div>

    <!-- Script JavaScript untuk Fitur Download CSS -->
    <script>
        function downloadCSS() {
            // Teks kode CSS yang akan diunduh
            const cssContent = `body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
}

.container {
    width: 210mm;
    min-height: 297mm;
    padding: 20mm;
    margin: auto;
    background: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    box-sizing: border-box;
}

/* Ukuran dan Tata Letak Kop Surat */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #000;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

/* Pengaturan Ukuran Logo */
.logo {
    width: 80px;        /* Atur lebar logo sesuai kebutuhan */
    height: auto;       /* Menjaga rasio agar logo tidak gepeng */
    object-fit: contain;
}

.header-text {
    text-align: center;
    flex-grow: 1;
    padding: 0 15px;
}

.header-text h2 {
    margin: 0;
    font-size: 14pt;
    font-weight: bold;
}

.header-text h3 {
    margin: 0;
    font-size: 12pt;
    font-weight: bold;
}

.header-text p {
    margin: 2px 0;
    font-size: 8.5pt;
}`;

            // Proses membuat file dan mengunduhnya secara otomatis
            const blob = new Blob([cssContent], { type: 'text/css' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'style.css';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
